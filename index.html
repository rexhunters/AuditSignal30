<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AuditSignal 30</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#68738a;--line:#e4e8f0;--accent:#3b5ccc;--good:#16845b;--warn:#a56600}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,Arial,sans-serif}
header{background:#111a35;color:#fff;padding:24px 5vw}header h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:#cbd3eb}.wrap{max-width:1240px;margin:24px auto;padding:0 20px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:10px;z-index:5;box-shadow:0 5px 20px #1720330d}
input,select,button,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}input{min-width:260px;flex:1}button{cursor:pointer;background:var(--accent);border-color:var(--accent);color:white}button.secondary{background:#fff;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 3px 14px #17203308}.top{display:flex;justify-content:space-between;gap:10px}.rank{color:var(--muted)}h2{font-size:18px;margin:0 0 3px}.tag{display:inline-block;margin:7px 6px 8px 0;padding:3px 8px;border-radius:999px;background:#eef1ff;color:var(--accent);font-size:12px}.tag.good{background:#e7f7ef;color:var(--good)}.tag.warn{background:#fff4de;color:var(--warn)}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.value{margin:3px 0 12px}.card a{color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182b99;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modalbox textarea{width:100%;min-height:90px;margin:8px 0}.close{float:right;background:#fff;color:var(--ink);border-color:var(--line)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>AuditSignal 30</h1><p>Verification-first opportunity intelligence for Web3 security firms</p></header>
<main class="wrap">
<section class="toolbar">
<input id="q" placeholder="Search account, signal, category..." />
<select id="category"><option value="">All categories</option></select>
<select id="confidence"><option value="">All confidence</option><option>High</option><option>Medium</option><option>Low</option></select>
<select id="stage"><option value="">All stages</option><option>Research</option><option>Verified</option><option>Ready to contact</option><option>Contacted</option><option>Replied</option><option>Qualified</option><option>Disqualified</option></select>
<button id="export">Export filtered CSV</button><button class="secondary" id="reset">Reset</button>
</section>
<section class="stats"><div class="stat"><b id="total">0</b><span>Visible accounts</span></div><div class="stat"><b id="verified">0</b><span>Verified</span></div><div class="stat"><b id="p1">0</b><span>P1 priority</span></div><div class="stat"><b id="contacted">0</b><span>Contacted</span></div></section>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">Close</button><div id="modalContent"></div></div></div>
<script>
let accounts=[];
const extraDefaults={signal_date:'',source_url:'',source_date:'',audit_status:'To verify',technical_contact:'',verification_status:'Unverified',priority:'P2',stage:'Research',owner:'',last_checked:'',next_action:'Verify current signal, audit status and technical owner'};
const $=id=>document.getElementById(id);
async function load(){
 try{let r=await fetch('data.json');accounts=await r.json();}
 catch(e){accounts=window.AUDIT_SIGNAL_DATA||[];}
 accounts=accounts.map(x=>({...extraDefaults,...x}));
 let cats=[...new Set(accounts.map(x=>x.category).filter(Boolean))].sort();
 cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o)});
 render();
}
function filtered(){let q=$('q').value.toLowerCase(),cat=$('category').value,conf=$('confidence').value,stage=$('stage').value;return accounts.filter(a=>{let text=JSON.stringify(a).toLowerCase();return(!q||text.includes(q))&&(!cat||a.category===cat)&&(!conf||a.confidence===conf)&&(!stage||a.stage===stage)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){let list=filtered();$('total').textContent=list.length;$('verified').textContent=list.filter(a=>a.verification_status==='Verified').length;$('p1').textContent=list.filter(a=>a.priority==='P1').length;$('contacted').textContent=list.filter(a=>['Contacted','Replied','Qualified'].includes(a.stage)).length;
$('grid').innerHTML=list.length?list.map((a,i)=>`<article class="card"><div class="top"><div><span class="rank">#${esc(a.rank)}</span><h2>${esc(a.account)}</h2></div><span class="tag">${esc(a.priority)}</span></div><span class="tag">${esc(a.category)}</span><span class="tag ${a.verification_status==='Verified'?'good':'warn'}">${esc(a.verification_status)}</span><div class="label">Signal</div><div class="value">${esc(a.signal)}</div><div class="label">Audit hypothesis</div><div class="value">${esc(a.audit_hypothesis)}</div><div class="label">Target</div><div class="value">${esc(a.technical_contact||a.target_role)}</div><div class="actions"><button onclick="openModal(${accounts.indexOf(a)})">Open record</button><a href="${esc(a.website)}" target="_blank" rel="noopener">Website</a></div></article>`).join(''):'<div class="empty">No matching accounts.</div>'}
function openModal(i){let a=accounts[i];$('modalContent').innerHTML=`<h2>${esc(a.account)}</h2><p class="label">${esc(a.category)} · ${esc(a.stage)} · ${esc(a.priority)}</p><p><strong>Signal:</strong><br>${esc(a.signal)}</p><p><strong>Audit hypothesis:</strong><br>${esc(a.audit_hypothesis)}</p><label class="label">Signal date</label><input id="m_signal_date" value="${esc(a.signal_date)}"><label class="label">Source URL</label><input id="m_source_url" value="${esc(a.source_url||a.website)}"><label class="label">Audit status</label><input id="m_audit_status" value="${esc(a.audit_status)}"><label class="label">Technical contact</label><input id="m_technical_contact" value="${esc(a.technical_contact)}"><label class="label">Verification status</label><select id="m_verification_status"><option>Unverified</option><option>Partially verified</option><option>Verified</option><option>Disqualified</option></select><label class="label">Priority</label><select id="m_priority"><option>P1</option><option>P2</option><option>P3</option></select><label class="label">Stage</label><select id="m_stage"><option>Research</option><option>Verified</option><option>Ready to contact</option><option>Contacted</option><option>Replied</option><option>Qualified</option><option>Disqualified</option></select><label class="label">Next action</label><textarea id="m_next_action">${esc(a.next_action)}</textarea><button onclick="saveRecord(${i})">Save in browser</button>`;$('m_verification_status').value=a.verification_status;$('m_priority').value=a.priority;$('m_stage').value=a.stage;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function saveRecord(i){let a=accounts[i];a.signal_date=$('m_signal_date').value;a.source_url=$('m_source_url').value;a.audit_status=$('m_audit_status').value;a.technical_contact=$('m_technical_contact').value;a.verification_status=$('m_verification_status').value;a.priority=$('m_priority').value;a.stage=$('m_stage').value;a.next_action=$('m_next_action').value;a.last_checked=new Date().toISOString().slice(0,10);localStorage.setItem('auditsignal30',JSON.stringify(accounts));closeModal();render()}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){let list=filtered(),keys=[...new Set(list.flatMap(Object.keys))],csv=[keys.join(',')].concat(list.map(a=>keys.map(k=>csvEscape(a[k])).join(','))).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='auditsignal30_filtered.csv';x.click();URL.revokeObjectURL(url)}
['q','category','confidence','stage'].forEach(id=>$(id).addEventListener('input',render));$('export').addEventListener('click',exportCSV);$('reset').addEventListener('click',()=>{['q','category','confidence','stage'].forEach(id=>$(id).value='');render()});
const saved=localStorage.getItem('auditsignal30');if(saved){try{window.AUDIT_SIGNAL_DATA=JSON.parse(saved)}catch(e){}}load();
</script>
</body></html>
